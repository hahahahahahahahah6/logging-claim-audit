[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logging-claim-audit"
version = "0.1.0"
description = "Offline auditor for documented record-keeping promises in Python projects."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "hao li"}]

[project.scripts]
logging-claim-audit = "logging_claim_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
